name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, develop ]

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-analyzer-${{ hashFiles('docker/Dockerfile.analyzer', 'pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-buildx-analyzer-
    
    - name: Build analyzer image
      run: |
        cd docker
        docker compose build analyzer
    
    - name: Run code analysis
      run: |
        cd docker
        docker compose run --rm analyzer

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-test-${{ hashFiles('docker/Dockerfile.test', 'pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-buildx-test-
    
    - name: Build test image
      run: |
        cd docker
        docker compose build test
    
    - name: Run unit tests
      run: |
        cd docker
        docker compose run --rm test
    
    - name: Extract coverage
      if: always()
      run: |
        docker cp flutter-test:/app/coverage ./coverage || true
    
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/lcov.info
        fail_ci_if_error: false

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [analyze, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-builder-${{ hashFiles('docker/Dockerfile.builder', 'pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-buildx-builder-
    
    - name: Build builder image
      run: |
        cd docker
        docker compose build builder
    
    - name: Build APK
      run: |
        cd docker
        docker compose run --rm builder
    
    - name: Extract APK from volume
      run: |
        docker run --rm -v flutter-build-output:/build alpine cat /build/app/outputs/flutter-apk/app-prod-release.apk > app-release.apk
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app-release.apk
        retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: app-release
    
    - name: Get version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="main-$(date +'%Y%m%d-%H%M%S')"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body: |
          ## SimpleNotes APK Release
          
          **Version:** ${{ steps.version.outputs.version }}
          **Build Date:** ${{ github.event.head_commit.timestamp }}
          **Commit:** ${{ github.sha }}
          
          ### Changes
          ${{ github.event.head_commit.message }}
          
          ### Download
          - [app-release.apk](app-release.apk) - Production release APK
        files: |
          app-release.apk
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: false  # Отключено, т.к. требует Chrome для headless тестирования
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build integration image
      run: |
        cd docker
        docker compose build integration
    
    - name: Run integration tests
      run: |
        cd docker
        docker compose run --rm integration
