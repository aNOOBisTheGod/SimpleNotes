name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-analyzer-${{ hashFiles('docker/Dockerfile.analyzer', 'pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-buildx-analyzer-
    
    - name: Build analyzer image
      run: |
        cd docker
        docker compose build analyzer
    
    - name: Run code analysis
      run: |
        cd docker
        docker compose run --rm analyzer

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-test-${{ hashFiles('docker/Dockerfile.test', 'pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-buildx-test-
    
    - name: Build test image
      run: |
        cd docker
        docker compose build test
    
    - name: Run unit tests
      run: |
        cd docker
        docker compose run --rm test
    
    - name: Extract coverage
      if: always()
      run: |
        docker cp flutter-test:/app/coverage ./coverage || true
    
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/lcov.info
        fail_ci_if_error: false

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [analyze, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-builder-${{ hashFiles('docker/Dockerfile.builder', 'pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-buildx-builder-
    
    - name: Build builder image
      run: |
        cd docker
        docker compose build builder
    
    - name: Build APK
      run: |
        cd docker
        docker compose run --rm builder
    
    - name: Extract APK
      run: |
        docker cp flutter-builder:/app/build/app/outputs/flutter-apk/app-prod-release.apk ./app-release.apk
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app-release.apk
        retention-days: 30

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: false  # Отключено, т.к. требует Chrome для headless тестирования
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build integration image
      run: |
        cd docker
        docker compose build integration
    
    - name: Run integration tests
      run: |
        cd docker
        docker compose run --rm integration
