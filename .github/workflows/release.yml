name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Create Docker volumes
      run: |
        docker volume create flutter-build-output || true
        docker volume create flutter-test-coverage || true
    
    - name: Run full CI/CD pipeline
      run: |
        cd docker
        docker compose build
        docker compose run --rm analyzer
        docker compose run --rm test
        docker compose run --rm builder
    
    - name: Extract APK from volume
      run: |
        docker run --rm -v flutter-build-output:/build alpine cat /build/app/outputs/flutter-apk/app-prod-release.apk > app-release.apk
    
    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building release for version: $VERSION"
    
    - name: Get APK info
      id: apk_info
      run: |
        APK_SIZE=$(du -h app-release.apk | cut -f1)
        echo "size=$APK_SIZE" >> $GITHUB_OUTPUT
        echo "APK size: $APK_SIZE"
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: app-release.apk
        name: SimpleNotes ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## 📱 SimpleNotes Release ${{ steps.get_version.outputs.VERSION }}
          
          ### 📦 Download
          - **[app-release.apk]** - Production release APK (${{ steps.apk_info.outputs.size }})
          
          ### ℹ️ Build Information
          - **Version:** ${{ steps.get_version.outputs.VERSION }}
          - **Commit:** ${{ github.sha }}
          - **Build Date:** ${{ github.event.head_commit.timestamp }}
          - **Flavor:** Production
          
          ### 🚀 Installation
          1. Download `app-release.apk`
          2. Enable "Install from unknown sources" on your Android device
          3. Install the APK
          
          ### ✅ CI/CD Pipeline
          - ✓ Code Analysis
          - ✓ Unit Tests  
          - ✓ APK Build
          
          ---
          Built with Docker CI/CD pipeline
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
