name: Quick Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quick-check:
    name: Quick Analysis and Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build images
      run: |
        cd docker
        docker compose build analyzer test
    
    - name: Run analyzer and tests in parallel
      run: |
        cd docker
        docker compose up --abort-on-container-exit analyzer test
    
    - name: Check results
      if: always()
      run: |
        docker ps -a
        docker compose ps
